version: '3.8'

services:
  chatbot:
    build: ../../Downloads/Chatbot-main
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - .:/app
    restart: unless-stopped
    
  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chatbot
    profiles:
      - production