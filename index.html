<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./style.css">
    <title>Google Based ChatBot</title>
</head>
<body>
    <img class="chatbotImage" src="./chatbot.png" alt="Chatbot" />
    <span id="chatbotOutput" class="chatbotOutput">Hello! Ask me anything and I'll search the web for answers.</span>
    <input id="chatbotInput" class="chatbotInput" placeholder="Type your question here..." />
    <input id="submitButton" type="submit" value="Ask" />
    <script src='./app.js'></script>
</body>
</html>
